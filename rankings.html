<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Club rankings | Padel Vitals</title>
<meta name="description" content="Padel Vitals clubs ranked by how much their players improve and how often they train.">
<meta name="theme-color" content="#0B0D0F">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--ink:#0B0D0F;--court:#171A1E;--line:rgba(255,255,255,.09);--text:#F2F4F5;--muted:#9AA3AB;--volt:#C8F542;--sea:#35C6D6}
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%, #24300C 0%, var(--ink) 50%);color:var(--text);font-family:"Instrument Sans",system-ui,sans-serif;padding:24px 16px 60px}
  .wrap{max-width:560px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:8px;font-family:Anton,Impact,sans-serif;font-size:20px;text-transform:uppercase;color:var(--text);text-decoration:none}
  .brand svg{width:14px;height:21px}
  .brand .v{color:var(--volt)}
  .card{margin-top:22px;background:var(--court);border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--volt)}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:30px;margin:8px 0 2px}
  .clubs{color:var(--muted);font-size:14px}
  .lvl{display:flex;align-items:flex-end;gap:14px;margin:22px 0 6px}
  .lvl b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:96px;line-height:.9;color:var(--volt)}
  .lvl span{color:var(--muted);font-size:14px;padding-bottom:10px}
  .verified{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sea);border:1px solid rgba(53,198,214,.3);border-radius:100px;padding:4px 10px;margin-top:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
  .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px}
  .stat small{color:var(--muted);font-size:12px}
  .sk{display:grid;grid-template-columns:120px 1fr 36px;gap:12px;align-items:center;padding:7px 0;font-size:14px}
  .tr{height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden}
  .tr i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--sea),var(--volt))}
  .sk b{text-align:right;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:17px}
  .foot{margin-top:22px;color:var(--muted);font-size:12.5px;line-height:1.5}
  .foot a{color:var(--volt)}
  .msg{margin-top:60px;text-align:center;color:var(--muted)}
.row{display:grid;grid-template-columns:34px 1fr auto auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .pos{font-family:Anton,Impact,sans-serif;font-size:24px;color:var(--muted);text-align:center}
  .row:first-of-type .pos{color:var(--volt)}
  .who b{display:block;font-size:16px}
  .who small{color:var(--muted);font-size:12.5px}
  .num{text-align:right;line-height:1.1}
  .num b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px}
  .num small{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  h1.big{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:52px;line-height:1;text-transform:uppercase;margin:26px 0 8px}
  .sub{color:var(--muted);font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="index.html"><svg viewBox="0 0 80 120" aria-hidden="true"><ellipse cx="40" cy="42" rx="29" ry="35" fill="none" stroke="#F2F4F5" stroke-width="8"/><path d="M24 71 L35 90 M56 71 L45 90" fill="none" stroke="#F2F4F5" stroke-width="8" stroke-linecap="round"/><rect x="32" y="89" width="16" height="27" rx="3" fill="#F2F4F5"/><polyline points="2,44 21,44 26,33 33,60 40,20 46,52 50,44 78,44" fill="none" stroke="#C8F542" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></svg><span><span class="v">Padel</span> Vitals</span></a>
  <h1 class="big">Club vs club</h1>
  <p class="sub">Every Padel Vitals club, ranked by how much their players improve (level gained in 90 days) and how often they train (sessions per player in the last 30 days).</p>
  <div class="card" id="out"><p class="msg">Loading…</p></div>
  <p class="foot">One club per region, worldwide. <a href="states.html">See which regions are still open</a>.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/regions.js?v=45"></script>
<script src="assets/data.js?v=45"></script>
<script src="assets/backend.js?v=45"></script>
<script>
(function(){
  "use strict";
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  var names = {}; try{ (window.PV_REGIONS || []).forEach(function(c){ names[c.code] = c.name; }); }catch(e){}
  function render(list){
    var el = document.getElementById("out");
    if(!list || !list.length){ el.innerHTML = '<p class="msg" style="margin:20px 0">The first clubs are joining now. Rankings appear here as they train.</p>'; return; }
    list.sort(function(a,b){ return (b.gain_90*10 + b.sessions_pp) - (a.gain_90*10 + a.sessions_pp); });
    el.innerHTML = list.map(function(c, i){
      return '<div class="row"><span class="pos">'+(i+1)+'</span><span class="who"><b>'+esc(c.name)+'</b><small>'+esc([c.city, names[c.country] || c.country].filter(Boolean).join(", "))+' · '+c.players+' players</small></span>'+
        '<span class="num"><b>'+(c.gain_90 >= 0 ? "+" : "")+Number(c.gain_90).toFixed(2)+'</b><small>Level, 90d</small></span>'+
        '<span class="num"><b>'+Number(c.sessions_pp).toFixed(1)+'</b><small>Sessions</small></span></div>';
    }).join("");
  }
  if(!window.PV || !window.PV.ready){ render([]); return; }
  window.PV.act.rankings().then(render).catch(function(){ render([]); });
})();
</script>
</body>
</html>
