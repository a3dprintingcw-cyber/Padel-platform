<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly report | Padel Vitals</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{--ink:#0B0D0F;--paper:#FFFFFF;--soft:#F3F5F2;--line:#E3E6E1;--muted:#6B737A;--volt:#C8F542;--volt-d:#7FA312;--good:#1F9D55;--bad:#C2410C}
  *{box-sizing:border-box}
  html,body{margin:0;background:#E9ECE8;color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 16px;background:var(--ink);color:#fff}
  .bar button,.bar a{font:600 13px "Instrument Sans",sans-serif;padding:9px 14px;border-radius:100px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;cursor:pointer;text-decoration:none}
  .bar .pri{background:var(--volt);border-color:var(--volt);color:var(--ink)}
  .bar .m{font-family:"IBM Plex Mono",monospace;font-size:13px;min-width:120px;text-align:center}
  .page{max-width:820px;margin:20px auto;background:var(--paper);padding:44px 48px;border-radius:6px;box-shadow:0 20px 50px -30px rgba(0,0,0,.4)}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:4px solid var(--ink);padding-bottom:18px}
  .brand{display:flex;align-items:center;gap:8px;font-family:Anton,Impact,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.01em}
  .brand svg{width:16px;height:24px}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:44px;line-height:1;margin:8px 0 4px;text-transform:uppercase}
  .sub{color:var(--muted);font-size:14px}
  .club{text-align:right}
  .club b{display:block;font-size:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
  .kpi{background:var(--soft);border-radius:8px;padding:14px}
  .kpi b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:32px;line-height:1.1}
  .kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .kpi .up{color:var(--good)} .kpi .down{color:var(--bad)}
  h2{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
  td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
  .tr{height:8px;border-radius:4px;background:var(--soft);position:relative;min-width:120px}
  .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ink)}
  .tr em{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--volt-d);border-radius:2px}
  .d{font-family:"IBM Plex Mono",monospace;font-size:12px}
  .d.up{color:var(--good)} .d.down{color:var(--bad)} .d.flat{color:var(--muted)}
  .goal{display:grid;grid-template-columns:1fr 2fr auto;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .note{padding:10px 0;border-bottom:1px solid var(--line)}
  .note p{margin:0 0 4px;font-size:14.5px;line-height:1.5}
  .note small{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px}
  .empty{color:var(--muted);font-size:13.5px}
  footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
  .msg{max-width:520px;margin:80px auto;text-align:center;font-size:15px;color:#333}
  @media (max-width:640px){ .page{padding:26px 18px;margin:0;border-radius:0} .kpis{grid-template-columns:repeat(2,1fr)} h1{font-size:34px} header.top{flex-direction:column} .club{text-align:left} .tr{min-width:60px} }
  @media print{ html,body{background:#fff} .bar{display:none} .page{box-shadow:none;margin:0;max-width:none;padding:0} @page{margin:16mm} }
</style>
</head>
<body>
<div class="bar" id="bar">
  <button id="prev" aria-label="Previous month">&larr;</button>
  <span class="m" id="mlabel"></span>
  <button id="next" aria-label="Next month">&rarr;</button>
  <button class="pri" id="print">Save as PDF</button>
</div>
<div id="out"><p class="msg">Loading…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.R2 = window.R2 || {};</script>
<script src="assets/data.js?v=43"></script>
<script src="assets/backend.js?v=43"></script>
<script>
(function(){
  "use strict";
  var qs = new URLSearchParams(location.search);
  var pid = qs.get("player"), demo = qs.get("demo") === "1" || !pid;
  var lang = "en"; try{ lang = localStorage.getItem("pv.lang") || (navigator.language || "en").slice(0,2); }catch(e){}
  var loc = {en:"en-US", es:"es-ES", pt:"pt-PT", it:"it-IT", fr:"fr-FR", de:"de-DE", nl:"nl-NL", sv:"sv-SE"}[lang] || "en-US";
  var now = new Date(), month = qs.get("m") ? new Date(qs.get("m") + "-01T12:00:00") : new Date(now.getFullYear(), now.getMonth(), 1, 12);
  function $(s){ return document.querySelector(s); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function fd(d){ return new Date(d).toLocaleDateString(loc, {day:"numeric", month:"short"}); }
  var LOGO = '<svg viewBox="0 0 80 120" aria-hidden="true"><ellipse cx="40" cy="42" rx="29" ry="35" fill="none" stroke="#0B0D0F" stroke-width="8"/><path d="M24 71 L35 90 M56 71 L45 90" fill="none" stroke="#0B0D0F" stroke-width="8" stroke-linecap="round"/><rect x="32" y="89" width="16" height="27" rx="3" fill="#0B0D0F"/><polyline points="2,44 21,44 26,33 33,60 40,20 46,52 50,44 78,44" fill="none" stroke="#7FA312" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></svg>';

  function range(){
    var from = new Date(month.getFullYear(), month.getMonth(), 1), to = new Date(month.getFullYear(), month.getMonth() + 1, 1);
    return {from:from, to:to};
  }

  function demoData(){
    var D = window.R2, r = range(), me = (D.ROSTER || []).filter(function(p){ return p.me; })[0] || {rating:3.25};
    var ratings = [];
    (D.SKILLS || []).forEach(function(s, i){
      ratings.push({skill:s.n, score:Math.max(1, s.v - 0.6 - (i % 3) / 10), at:new Date(r.from.getTime() - 20*864e5).toISOString()});
      ratings.push({skill:s.n, score:s.v, at:new Date(r.from.getTime() + (5 + i)*864e5).toISOString()});
    });
    return {player:{name:D.PLAYER.name, email:D.PLAYER.email, level:me.rating, group:"Advanced"},
            club:{name:"Miami Padel Club", city:"Miami"}, ratings:ratings,
            notes:[{body:"Bandeja is landing deep now, keep the racket face open on the follow through. Next block we work on the víbora.", at:new Date(r.from.getTime() + 9*864e5).toISOString(), by:"Diego Morales"}],
            attended:7, offered:8, points:520,
            goals:[{skill:"Víbora", target:6.5, start:4.2, done:null}, {skill:"Bandeja", target:6.0, start:5.1, done:new Date().toISOString()}],
            levels:[{level:me.rating - 0.25, at:new Date(r.from.getTime() - 60*864e5).toISOString()}, {level:me.rating, at:new Date(r.from.getTime() + 12*864e5).toISOString()}]};
  }

  function render(d){
    var r = range();
    var inMonth = function(x){ var t = new Date(x.at); return t >= r.from && t < r.to; };
    /* per shot: score at the start of the month vs the latest score by its end */
    var skills = {}, order = [];
    (d.ratings || []).forEach(function(x){
      if(!skills[x.skill]){ skills[x.skill] = {before:null, end:null, count:0}; order.push(x.skill); }
      var s = skills[x.skill], t = new Date(x.at);
      if(t < r.from) s.before = Number(x.score);
      if(t < r.to){ s.end = Number(x.score); if(t >= r.from) s.count++; }
    });
    var rows = order.map(function(k){
      var s = skills[k], start = s.before == null ? s.end : s.before;
      return {k:k, start:start, end:s.end, d: s.end != null && start != null ? Math.round((s.end - start)*10)/10 : 0, count:s.count};
    }).filter(function(x){ return x.end != null; }).sort(function(a,b){ return b.end - a.end; });
    var rated = rows.filter(function(x){ return x.count; }).length;
    var lv = d.levels || [], lvStart = null;
    lv.forEach(function(x){ if(new Date(x.at) < r.from) lvStart = Number(x.level); });
    var level = Number(d.player.level) || 0, lvD = lvStart != null ? Math.round((level - lvStart)*100)/100 : 0;
    var pct = d.offered ? Math.round(d.attended / d.offered * 100) : null;
    var mname = month.toLocaleDateString(loc, {month:"long", year:"numeric"});
    var notes = (d.notes || []);
    var html = '<article class="page">'+
      '<header class="top"><div><div class="brand">'+LOGO+'<span>Padel Vitals</span></div>'+
        '<div class="eyebrow" style="margin-top:16px">Monthly report · '+esc(mname)+'</div>'+
        '<h1>'+esc(d.player.name || d.player.email)+'</h1>'+
        '<div class="sub">'+esc([d.player.group, d.club.name].filter(Boolean).join(" · "))+'</div></div>'+
        '<div class="club"><b>'+esc(d.club.name)+'</b><span class="sub">'+esc(d.club.city || "")+'</span></div></header>'+
      '<div class="kpis">'+
        '<div class="kpi"><b>'+level.toFixed(2)+'</b><small>Level'+(lvD ? ' · <span class="'+(lvD > 0 ? "up" : "down")+'">'+(lvD > 0 ? "+" : "")+lvD.toFixed(2)+'</span>' : '')+'</small></div>'+
        '<div class="kpi"><b>'+d.attended+(d.offered ? '<span style="font-size:18px;color:#6B737A">/'+d.offered+'</span>' : '')+'</b><small>Sessions attended'+(pct != null ? ' · '+pct+'%' : '')+'</small></div>'+
        '<div class="kpi"><b>'+rated+'</b><small>Shots rated this month</small></div>'+
        '<div class="kpi"><b>'+Number(d.points || 0).toLocaleString(loc)+'</b><small>Points earned</small></div>'+
      '</div>'+
      '<h2>Shots</h2>'+
      (rows.length ? '<table><thead><tr><th>Shot</th><th>Score out of 10</th><th style="text-align:right">Now</th><th style="text-align:right">Month</th></tr></thead><tbody>'+
        rows.map(function(x){
          var cls = x.d > 0 ? "up" : x.d < 0 ? "down" : "flat";
          return '<tr><td>'+esc(x.k)+'</td><td><div class="tr"><i style="width:'+(x.end*10)+'%"></i>'+(x.start != null && x.start !== x.end ? '<em style="left:calc('+(x.start*10)+'% - 1px)"></em>' : '')+'</div></td>'+
            '<td class="n">'+x.end.toFixed(1)+'</td><td class="n"><span class="d '+cls+'">'+(x.d > 0 ? "+" : "")+x.d.toFixed(1)+'</span></td></tr>';
        }).join("")+'</tbody></table><p class="empty" style="margin-top:6px">Green mark: score at the start of the month.</p>'
        : '<p class="empty">No ratings yet.</p>')+
      '<h2>Goals</h2>'+
      ((d.goals || []).length ? d.goals.map(function(g){
        var cur = skills[g.skill] ? skills[g.skill].end : null, nowV = cur != null ? cur : Number(g.start);
        var p = g.done ? 100 : Math.max(0, Math.min(100, (nowV - g.start) / Math.max(0.1, g.target - g.start) * 100));
        return '<div class="goal"><b>'+esc(g.skill)+'</b><div class="tr"><i style="width:'+p+'%;background:'+(g.done ? "#1F9D55" : "#0B0D0F")+'"></i></div>'+
          '<span class="d '+(g.done ? "up" : "flat")+'">'+(g.done ? "Reached " : nowV.toFixed(1)+" → ")+Number(g.target).toFixed(1)+'</span></div>';
      }).join("") : '<p class="empty">No goals set.</p>')+
      '<h2>Coach notes</h2>'+
      (notes.length ? notes.map(function(n){ return '<div class="note"><p>'+esc(n.body)+'</p><small>'+esc(n.by || "")+' · '+fd(n.at)+'</small></div>'; }).join("") : '<p class="empty">No notes this month.</p>')+
      '<footer><span>padelvitals.com</span><span>Generated '+fd(new Date())+'</span></footer>'+
    '</article>';
    $("#out").innerHTML = html;
    document.title = (d.player.name || "Player") + " · " + mname + " | Padel Vitals";
  }

  function load(){
    $("#mlabel").textContent = month.toLocaleDateString(loc, {month:"long", year:"numeric"});
    $("#next").disabled = month.getFullYear() === now.getFullYear() && month.getMonth() === now.getMonth();
    if(demo){ render(demoData()); return; }
    var PV = window.PV;
    if(!PV || !PV.ready){ $("#out").innerHTML = '<p class="msg">Offline. Try again with a connection.</p>'; return; }
    PV.session().then(function(s){
      if(!s){ $("#out").innerHTML = '<p class="msg">Sign in to see this report. <a href="app.html">Open the app</a></p>'; return; }
      var r = range();
      return PV.act.report(pid, r.from.toISOString(), r.to.toISOString()).then(render);
    }).catch(function(err){
      $("#out").innerHTML = '<p class="msg">'+esc((err && err.message) === "not allowed" ? "You don't have access to this player's report." : (err && err.message) || "Something went wrong")+'</p>';
    });
  }
  function shift(n){ month = new Date(month.getFullYear(), month.getMonth() + n, 1, 12); load(); }
  $("#prev").onclick = function(){ shift(-1); };
  $("#next").onclick = function(){ shift(1); };
  $("#print").onclick = function(){ window.print(); };
  load();
})();
</script>
</body>
</html>
